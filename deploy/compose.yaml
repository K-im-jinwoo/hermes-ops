services:
  hermes-gateway:
    profiles: ["candidate"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: "${HERMES_IMAGE:-hermes-ops:2026-09-17-direct-drive-crud}"
    user: "${HERMES_CONTAINER_UID:-1000}:${HERMES_CONTAINER_GID:-1000}"
    restart: unless-stopped
    read_only: true
    environment:
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram-bot-token
      TELEGRAM_ALLOWED_USER_IDS: "${TELEGRAM_ALLOWED_USER_IDS:?required}"
      TELEGRAM_DELETE_WEBHOOK: "${TELEGRAM_DELETE_WEBHOOK:-false}"
      LLM_WIKI_ROOT: /srv/llm-wiki/current
      HERMES_MEMO_SINK: queue
      HERMES_INBOX_QUEUE_DIR: /var/lib/hermes/inbox_queue
      HERMES_APPROVAL_DB_PATH: /var/lib/hermes/state/memo_approvals.sqlite3
      HERMES_METRICS_LOG: /var/lib/hermes/state/events.jsonl
      GOOGLE_DRIVE_CREDENTIALS_FILE: /run/secrets/google-drive-credentials
      GOOGLE_DRIVE_ROOT_ID: "${GOOGLE_DRIVE_ROOT_ID:-}"
      HARNESS_API_URL: "${HARNESS_API_URL:-}"
    volumes:
      - type: bind
        source: "${WIKI_CURRENT_HOST_DIR:-/srv/llm-wiki/current}"
        target: /srv/llm-wiki/current
        read_only: true
      - type: bind
        source: "${HERMES_STATE_HOST_DIR:-/srv/hermes-ops/state}"
        target: /var/lib/hermes/state
      - type: bind
        source: "${HERMES_QUEUE_HOST_DIR:-/srv/hermes-ops/queue}"
        target: /var/lib/hermes/inbox_queue
      - type: bind
        source: "${GOOGLE_DRIVE_CREDENTIALS_HOST_FILE:-/srv/hermes-ops/google-drive-credentials.json}"
        target: /run/secrets/google-drive-credentials
        read_only: true
    secrets:
      - telegram-bot-token
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    networks:
      - n8n-private
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  telegram-bot-token:
    file: "${TELEGRAM_BOT_TOKEN_HOST_FILE:?required}"

networks:
  n8n-private:
    external: true
    name: "${N8N_DOCKER_NETWORK:-n8n-infra_default}"
